apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: rentsphere
  source:
    repoURL: https://github.com/ixi3boda/RentSphere.git
    targetRevision: main
    path: k8s/platform
  destination:
    server: https://kubernetes.default.svc
    # Everything here is cluster-scoped; the namespace only satisfies the project's rules
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # The CRDs arrive with the previous wave
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        maxDuration: 3m
