apiVersion: batch/v1
kind: CronJob
metadata:
  name: mysql-backup
spec:
  # 02:30 UTC, before the 03:00 demo-data reset
  schedule: "30 2 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: mysql-backup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            # A consistent snapshot without locking the tables
            - name: dump
              image: mysql:8.4
              command:
                - sh
                - -c
                - |
                  set -eu
                  file="/backup/rentsphere-$(date -u +%Y-%m-%dT%H%M%SZ).sql.gz"
                  mysqldump -h mysql -uroot --single-transaction --routines --triggers \
                    --no-tablespaces --set-gtid-purged=OFF RentSphereSchema | gzip > "$file"
                  test "$(gzip -cd "$file" | tail -1 | grep -c 'Dump completed')" = 1
                  ls -l "$file"
              env:
                - name: MYSQL_PWD
                  valueFrom:
                    secretKeyRef:
                      name: rentsphere-secrets
                      key: MYSQL_ROOT_PASSWORD
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { memory: 256Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: backup
                  mountPath: /backup
          containers:
            - name: upload
              image: amazon/aws-cli:2.38.1
              command: ["sh", "-c", "aws s3 cp /backup/ \"s3://$BACKUP_BUCKET/mysql/\" --recursive --only-show-errors && aws s3 ls \"s3://$BACKUP_BUCKET/mysql/\" | tail -3"]
              env:
                - name: BACKUP_BUCKET
                  valueFrom:
                    configMapKeyRef:
                      name: cluster-config
                      key: BACKUP_BUCKET
                - name: HOME
                  value: /tmp
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { memory: 256Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: backup
                  mountPath: /backup
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: backup
              emptyDir: {}
            - name: tmp
              emptyDir: {}
