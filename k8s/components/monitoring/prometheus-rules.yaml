apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: rentsphere
spec:
  groups:
    - name: rentsphere.slo
      rules:
        # Recording rules keep the alert and dashboard queries cheap
        - record: rentsphere:http_requests:rate5m
          expr: sum(rate(http_server_requests_seconds_count{namespace="rentsphere", uri!~"/actuator.*"}[5m]))
        - record: rentsphere:http_errors:ratio_rate5m
          expr: |
            sum(rate(http_server_requests_seconds_count{namespace="rentsphere", uri!~"/actuator.*", status=~"5.."}[5m]))
              / clamp_min(sum(rate(http_server_requests_seconds_count{namespace="rentsphere", uri!~"/actuator.*"}[5m])), 1e-9)
        - record: rentsphere:http_latency:p95_5m
          expr: histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{namespace="rentsphere", uri!~"/actuator.*"}[5m])))

    - name: rentsphere.alerts
      rules:
        - alert: RentSphereApiDown
          expr: absent(up{namespace="rentsphere", service="backend"} == 1)
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: No API pod is answering the metrics scrape
            description: Every backend target has been down for 2 minutes. Check `kubectl -n rentsphere get pods` and the pod logs.

        - alert: RentSphereHighErrorRate
          expr: rentsphere:http_errors:ratio_rate5m > 0.02 and rentsphere:http_requests:rate5m > 0.1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: More than 2% of API requests are failing
            description: "5xx ratio is {{ $value | humanizePercentage }} over the last 5 minutes."

        - alert: RentSphereSlowResponses
          expr: rentsphere:http_latency:p95_5m > 0.5
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: API p95 latency is above 500 ms
            description: "p95 is {{ $value | humanizeDuration }}. The load test baseline is under 100 ms."

        - alert: RentSphereDatabasePoolSaturated
          expr: sum(hikaricp_connections_pending{namespace="rentsphere"}) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Requests are queueing for a database connection
            description: Raise SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE or look for slow queries.

        - alert: RentSphereJvmHeapHigh
          expr: max by (pod) (jvm_memory_used_bytes{namespace="rentsphere", area="heap"} / jvm_memory_max_bytes{namespace="rentsphere", area="heap"}) > 0.9
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.pod }} is using over 90% of its heap"

        - alert: RentSpherePodRestarting
          expr: increase(kube_pod_container_status_restarts_total{namespace="rentsphere"}[15m]) > 2
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.pod }} restarted more than twice in 15 minutes"
