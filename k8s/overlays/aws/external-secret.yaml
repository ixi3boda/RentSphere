# The app secrets live in SSM Parameter Store (written by Terraform). External Secrets reads
# them with the node's IAM role and keeps this Kubernetes Secret in sync.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rentsphere-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-parameter-store
  target:
    name: rentsphere-secrets
    creationPolicy: Owner
  dataFrom:
    - find:
        path: /rentsphere/production
        name:
          regexp: ".*"
      rewrite:
        # /rentsphere/production/JWT_SECRET -> JWT_SECRET
        - regexp:
            source: "/rentsphere/production/(.*)"
            target: "$1"
