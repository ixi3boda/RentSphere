# Grafana Cloud endpoints and token, written to SSM by Terraform (grafana_cloud_* variables)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-cloud
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-parameter-store
  target:
    name: grafana-cloud
  dataFrom:
    - find:
        path: /rentsphere/monitoring
        name:
          regexp: ".*"
      rewrite:
        - regexp:
            source: "/rentsphere/monitoring/(.*)"
            target: "$1"
