# Single-binary Tempo receiving OTLP from Alloy
tempo:
  retention: 72h
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
  resources:
    requests: { cpu: 50m, memory: 128Mi }
persistence:
  enabled: true
  size: 5Gi
