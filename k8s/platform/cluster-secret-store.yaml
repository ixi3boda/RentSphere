# No credentials here: External Secrets uses the EC2 node's IAM role, which may only read
# /rentsphere/production/* (see infra/terraform/modules/k3s-node)
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-parameter-store
spec:
  provider:
    aws:
      service: ParameterStore
      region: us-east-1
