# Restores a backup from S3 into the running database. Applied by `make db-restore`, which
# fills BACKUP_KEY (empty = the newest backup). It replaces the tables in RentSphereSchema.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: mysql-restore-
  namespace: rentsphere
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysql-restore
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: download
          image: amazon/aws-cli:2.38.1
          command:
            - sh
            - -c
            - |
              set -eu
              key="${BACKUP_KEY:-$(aws s3 ls "s3://$BACKUP_BUCKET/mysql/" | sort | tail -1 | awk '{print $4}')}"
              test -n "$key" || { echo "no backups in s3://$BACKUP_BUCKET/mysql/"; exit 1; }
              echo "restoring $key"
              aws s3 cp "s3://$BACKUP_BUCKET/mysql/$key" /restore/backup.sql.gz --only-show-errors
          env:
            - name: BACKUP_KEY
              value: "${BACKUP_KEY}"
            - name: BACKUP_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: cluster-config
                  key: BACKUP_BUCKET
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: restore
              mountPath: /restore
            - name: tmp
              mountPath: /tmp
      containers:
        - name: restore
          image: mysql:8.4
          command:
            - sh
            - -c
            - |
              set -eu
              gzip -cd /restore/backup.sql.gz | mysql -h mysql -uroot RentSphereSchema
              mysql -h mysql -uroot RentSphereSchema -N -e \
                "SELECT CONCAT('restored: ', COUNT(*), ' users, ', (SELECT COUNT(*) FROM properties), ' listings') FROM users"
          env:
            - name: MYSQL_PWD
              valueFrom:
                secretKeyRef:
                  name: rentsphere-secrets
                  key: MYSQL_ROOT_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: restore
              mountPath: /restore
              readOnly: true
      volumes:
        - name: restore
          emptyDir: {}
        - name: tmp
          emptyDir: {}
