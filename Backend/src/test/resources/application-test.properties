# ─────────────────────────────────────────────────────────────────
# Test profile — uses H2 in-memory instead of MySQL
# Active via @ActiveProfiles("test") on every test class
# ─────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:rentspheretest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 console (optional during test debugging)
spring.h2.console.enabled=false

# JPA — create schema from entities in test (we use JdbcTemplate raw SQL, so this is minimal)
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none

# Use the test schema SQL initializer
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-test.sql
spring.sql.init.data-locations=classpath:data-test.sql

# JWT secret (same as production for tests)
jwt.secret=0d1JZmj0UyE8ThIocgNAjtma2VCC8NlDSCMCetHB0b4=

# Suppress verbose Hibernate logging in tests
logging.level.org.hibernate=WARN
logging.level.org.springframework.security=WARN
