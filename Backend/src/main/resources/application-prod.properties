# Production overrides. Everything else (datasource, JWT, PayPal, server.port via SERVER_PORT)
# comes from application.properties; this file only holds what differs in production.
# Activated with SPRING_PROFILES_ACTIVE=prod, which also switches logback-spring.xml to JSON logs.

# HikariCP pool; small hosts override the size with SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain

logging.level.root=WARN
logging.level.com.example.RentSphere=INFO
