spring.application.name=RentSphere

# Local dev secrets live in .env at the repo root (gitignored); see .env.example
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/RentSphereSchema}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
spring.main.allow-circular-references=true
server.port=${SERVER_PORT:8080}
paypal.client.id=${PAYPAL_CLIENT_ID}
paypal.client.secret=${PAYPAL_CLIENT_SECRET}
paypal.mode=${PAYPAL_MODE:sandbox}

# No endpoint takes a file upload; JSON bodies are capped by BodySizeLimitFilter
spring.servlet.multipart.enabled=false
rentsphere.max-request-bytes=${RENTSPHERE_MAX_REQUEST_BYTES:65536}
spring.web.resources.add-mappings=true

# Behind a TLS-terminating proxy (Render, Nginx): trust its X-Forwarded-* headers so the app
# knows the request was HTTPS and sends HSTS
server.forward-headers-strategy=native
server.error.include-message=never
server.error.include-stacktrace=never

# Only the health probe is reachable over HTTP, and it reports status only
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
