name: RentSphere CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# The jobs only read the repository; deploy credentials come from secrets
permissions:
  contents: read

jobs:
  backend-test-build:
    name: Backend Build & Test (Spring Boot + JUnit 5 + JaCoCo)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: RentSphereSchema
          MYSQL_USER: rentsphere
          MYSQL_PASSWORD: ci_test_password
          MYSQL_ROOT_PASSWORD: ci_test_root_password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Initialize Database Schema
        run: |
          mysql -h 127.0.0.1 -P 3306 -u rentsphere -pci_test_password RentSphereSchema < Database/Schema.sql

      - name: Run Backend Unit & Integration Tests
        run: |
          cd Backend
          chmod +x mvnw
          ./mvnw clean test

      - name: Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: Backend/target/site/jacoco/

  frontend-test-build:
    name: Frontend Build & Test (React + Jest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd Frontend
          npm ci

      - name: Run Frontend Tests (Jest)
        run: |
          cd Frontend
          npm test -- --watchAll=false --coverage

      - name: Build Production React Bundle
        run: |
          cd Frontend
          npm run build

  compose-config:
    name: Validate Docker Compose file
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Provide placeholder env file for Compose
        run: cp .env.example .env

      - name: Validate Compose file
        run: docker compose config --quiet

  # Builds each image once. On a push to main it is pushed to GHCR, tagged with the commit
  # (sha-<short sha>) and latest; every later stage deploys that exact image, never a rebuild.
  docker-images:
    name: Docker image (${{ matrix.image }})
    needs: [backend-test-build, frontend-test-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - image: backend
            context: Backend
          - image: frontend
            context: Frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/rentsphere-${{ matrix.image }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy-to-ec2:
    name: Continuous Deployment to AWS EC2
    needs: [compose-config, docker-images]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to AWS EC2 via SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          if [ -z "$EC2_HOST" ] || [ -z "$EC2_SSH_KEY" ]; then
            echo "::notice ::AWS EC2 secrets (EC2_HOST, EC2_SSH_KEY) not configured in GitHub Secrets. Skipping automated deploy step."
            exit 0
          fi

          SSH_USER="${EC2_USER:-ubuntu}"
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/ec2_key.pem -o StrictHostKeyChecking=no "${SSH_USER}@${EC2_HOST}" << 'EOF'
            set -e
            PROJECT_DIR="$HOME/RentSphere"
            if [ ! -d "$PROJECT_DIR" ]; then
              git clone https://github.com/ixi3boda/RentSphere.git "$PROJECT_DIR"
              cd "$PROJECT_DIR"
              chmod +x deploy/setup-ec2.sh
              ./deploy/setup-ec2.sh
            else
              cd "$PROJECT_DIR"
              git fetch origin main
              git reset --hard origin/main
              docker compose build --parallel
              docker compose up -d --remove-orphans
              docker system prune -f
            fi
            sleep 5
            curl -fsSL http://localhost/actuator/health || true
          EOF
