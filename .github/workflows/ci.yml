name: RentSphere CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# The jobs only read the repository; deploy credentials come from secrets
permissions:
  contents: read

jobs:
  backend-test-build:
    name: Backend Build & Test (Spring Boot + JUnit 5 + JaCoCo)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: RentSphereSchema
          MYSQL_USER: rentsphere
          MYSQL_PASSWORD: ci_test_password
          MYSQL_ROOT_PASSWORD: ci_test_root_password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Backend Unit & Integration Tests
        run: |
          cd Backend
          chmod +x mvnw
          ./mvnw clean test

      # Unit tests run on H2, so this boots the real jar against MySQL 8: Flyway must create the
      # schema from scratch, the demo seed must load into it, and a restart must apply nothing.
      - name: Apply Flyway migrations to MySQL
        env:
          SPRING_PROFILES_ACTIVE: prod
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/RentSphereSchema?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
          SPRING_DATASOURCE_USERNAME: rentsphere
          SPRING_DATASOURCE_PASSWORD: ci_test_password
          JWT_SECRET: ci-only-jwt-secret-not-a-real-credential-0123456789
          PAYPAL_CLIENT_ID: ci-placeholder
          PAYPAL_CLIENT_SECRET: ci-placeholder
        run: |
          cd Backend
          ./mvnw -B -q -DskipTests -Djacoco.skip=true package
          MYSQL="mysql -h 127.0.0.1 -P 3306 -u rentsphere -pci_test_password RentSphereSchema"

          start_api() {
            java -jar target/*.jar > "api-$1.log" 2>&1 &
            echo $! > api.pid
            for i in $(seq 1 60); do
              curl -fsS http://127.0.0.1:8080/actuator/health && return 0
              sleep 2
            done
            cat "api-$1.log"; return 1
          }
          stop_api() { kill "$(cat api.pid)"; wait "$(cat api.pid)" 2>/dev/null || true; }

          start_api first
          $MYSQL -e "SELECT version, description, success FROM flyway_schema_history"
          applied=$($MYSQL -N -e 'SELECT COUNT(*) FROM flyway_schema_history WHERE success = 1')
          test "$applied" -eq "$(ls src/main/resources/db/migration/V*.sql | wc -l)"
          $MYSQL < src/main/resources/db/seed-demo.sql
          stop_api

          start_api second
          test "$($MYSQL -N -e 'SELECT COUNT(*) FROM flyway_schema_history')" = "$applied"
          test "$($MYSQL -N -e 'SELECT COUNT(*) FROM properties')" -gt 0
          stop_api

      - name: Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: Backend/target/site/jacoco/

  frontend-test-build:
    name: Frontend Build & Test (React + Jest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd Frontend
          npm ci

      - name: Run Frontend Tests (Jest)
        run: |
          cd Frontend
          npm test -- --watchAll=false --coverage

      - name: Build Production React Bundle
        run: |
          cd Frontend
          npm run build

  compose-config:
    name: Validate Docker Compose file
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Provide placeholder env file for Compose
        run: cp .env.example .env

      - name: Validate Compose file
        run: docker compose config --quiet

  kubernetes-manifests:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin kubeconform

      - name: Render and validate every overlay
        run: |
          # Secret generators read gitignored env files; the examples stand in for them here
          for example in k8s/overlays/*/secrets.env.example; do cp "$example" "${example%.example}"; done
          make k8s-validate

  # Builds each image once. On a push to main it is pushed to GHCR, tagged with the commit
  # (sha-<short sha>) and latest; every later stage deploys that exact image, never a rebuild.
  docker-images:
    name: Docker image (${{ matrix.image }})
    needs: [backend-test-build, frontend-test-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - image: backend
            context: Backend
          - image: frontend
            context: Frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/rentsphere-${{ matrix.image }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # GitOps release: deploy/production mirrors main with the new image tags written into the
  # AWS overlay. Argo CD in the cluster watches that branch and rolls the change out.
  release-production:
    name: Release to production (GitOps)
    needs: [docker-images, kubernetes-manifests, compose-config]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-production
      cancel-in-progress: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write the new image tags to deploy/production
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin deploy/production >/dev/null; then
            git switch -c deploy/production origin/deploy/production
          else
            git switch --orphan deploy/production
          fi
          # The branch gets main's exact tree, then only the image tags change
          git read-tree -u --reset "$GITHUB_SHA"

          export TAG="sha-${GITHUB_SHA::7}"
          yq -i '(.images[] | select(.name == "ghcr.io/ixi3boda/rentsphere-*")).newTag = strenv(TAG)' \
            k8s/overlays/aws/kustomization.yaml
          git add -A
          git commit -m "Release $TAG" -m "Built from ${GITHUB_SHA}"
          git push origin deploy/production
          echo "Released \`$TAG\` to deploy/production" >> "$GITHUB_STEP_SUMMARY"
