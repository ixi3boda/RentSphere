name: RentSphere CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test-build:
    name: Backend Build & Test (Spring Boot + JUnit 5 + JaCoCo)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: RentSphereSchema
          MYSQL_USER: rentsphere
          MYSQL_PASSWORD: rentsphere123
          MYSQL_ROOT_PASSWORD: rootpassword123
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Initialize Database Schema
        run: |
          mysql -h 127.0.0.1 -P 3306 -u rentsphere -prentsphere123 RentSphereSchema < Database/Schema.sql

      - name: Run Backend Unit & Integration Tests
        run: |
          cd Backend
          chmod +x mvnw
          ./mvnw clean test

      - name: Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: Backend/target/site/jacoco/

  frontend-test-build:
    name: Frontend Build & Test (React + Jest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd Frontend
          npm ci

      - name: Run Frontend Tests (Jest)
        run: |
          cd Frontend
          npm test -- --watchAll=false --coverage

      - name: Build Production React Bundle
        run: |
          cd Frontend
          npm run build

  docker-build:
    name: Docker Stack Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Build
        run: |
          docker compose config
          docker compose build
