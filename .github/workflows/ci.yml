name: RentSphere CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# The jobs only read the repository; deploy credentials come from secrets
permissions:
  contents: read

jobs:
  backend-test-build:
    name: Backend Build & Test (Spring Boot + JUnit 5 + JaCoCo)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: RentSphereSchema
          MYSQL_USER: rentsphere
          MYSQL_PASSWORD: ci_test_password
          MYSQL_ROOT_PASSWORD: ci_test_root_password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Backend Unit & Integration Tests
        run: |
          cd Backend
          chmod +x mvnw
          ./mvnw clean test

      # Unit tests run on H2, so this boots the real jar against MySQL 8: Flyway must create the
      # schema from scratch, the demo seed must load into it, and a restart must apply nothing.
      - name: Apply Flyway migrations to MySQL
        env:
          SPRING_PROFILES_ACTIVE: prod
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/RentSphereSchema?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
          SPRING_DATASOURCE_USERNAME: rentsphere
          SPRING_DATASOURCE_PASSWORD: ci_test_password
          JWT_SECRET: ci-only-jwt-secret-not-a-real-credential-0123456789
          PAYPAL_CLIENT_ID: ci-placeholder
          PAYPAL_CLIENT_SECRET: ci-placeholder
        run: |
          cd Backend
          ./mvnw -B -q -DskipTests -Djacoco.skip=true package
          MYSQL="mysql -h 127.0.0.1 -P 3306 -u rentsphere -pci_test_password RentSphereSchema"

          start_api() {
            java -jar target/*.jar > "api-$1.log" 2>&1 &
            echo $! > api.pid
            for i in $(seq 1 60); do
              curl -fsS http://127.0.0.1:8080/actuator/health && return 0
              sleep 2
            done
            cat "api-$1.log"; return 1
          }
          stop_api() { kill "$(cat api.pid)"; wait "$(cat api.pid)" 2>/dev/null || true; }

          start_api first
          $MYSQL -e "SELECT version, description, success FROM flyway_schema_history"
          applied=$($MYSQL -N -e 'SELECT COUNT(*) FROM flyway_schema_history WHERE success = 1')
          test "$applied" -eq "$(ls src/main/resources/db/migration/V*.sql | wc -l)"
          $MYSQL < src/main/resources/db/seed-demo.sql
          stop_api

          start_api second
          test "$($MYSQL -N -e 'SELECT COUNT(*) FROM flyway_schema_history')" = "$applied"
          test "$($MYSQL -N -e 'SELECT COUNT(*) FROM properties')" -gt 0
          stop_api

      - name: Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jacoco-coverage-report
          path: Backend/target/site/jacoco/

  frontend-test-build:
    name: Frontend Build & Test (React + Jest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 20
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd Frontend
          npm ci

      - name: Run Frontend Tests (Jest)
        run: |
          cd Frontend
          npm test -- --watchAll=false --coverage

      - name: Build Production React Bundle
        run: |
          cd Frontend
          npm run build

  compose-config:
    name: Validate Docker Compose file
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Provide placeholder env file for Compose
        run: cp .env.example .env

      - name: Validate Compose file
        run: docker compose config --quiet

  kubernetes-manifests:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin kubeconform

      - name: Render and validate every overlay
        run: |
          # Secret generators read gitignored env files; the examples stand in for them here
          for example in k8s/overlays/*/secrets.env.example; do cp "$example" "${example%.example}"; done
          make k8s-validate

  # Builds each image once, scans it, and on main pushes it to GHCR tagged with the commit
  # (sha-<short sha>) and latest, with an SBOM and a keyless Sigstore signature. Every later
  # stage deploys that exact image, never a rebuild.
  docker-images:
    name: Docker image (${{ matrix.image }})
    needs: [backend-test-build, frontend-test-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless signing: cosign exchanges the workflow's OIDC token for a short-lived certificate
      id-token: write

    strategy:
      matrix:
        include:
          - image: backend
            context: Backend
          - image: frontend
            context: Frontend

    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/rentsphere-${{ matrix.image }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          load: true
          tags: ${{ env.IMAGE }}:scan
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # Fails the build on a fixable HIGH or CRITICAL CVE, before anything is published
      - name: Scan for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          image-ref: ${{ env.IMAGE }}:scan
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '1'

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Push
        id: push
        if: github.event_name == 'push'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}

      - name: Generate the SBOM
        if: github.event_name == 'push'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          artifact-name: sbom-${{ matrix.image }}.spdx.json
          output-file: sbom-${{ matrix.image }}.spdx.json

      - name: Install cosign
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Signs the digest, and attaches the SBOM as a signed attestation; verify with
      # cosign verify --certificate-identity-regexp 'https://github.com/ixi3boda/RentSphere/' ...
      - name: Sign the image and attest the SBOM
        if: github.event_name == 'push'
        env:
          REF: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "$REF"
          cosign attest --yes --type spdxjson --predicate "sbom-${{ matrix.image }}.spdx.json" "$REF"

  # GitOps release: deploy/production mirrors main with the new image tags written into the
  # AWS overlay. Argo CD in the cluster watches that branch and rolls the change out.
  release-production:
    name: Release to production (GitOps)
    needs: [docker-images, kubernetes-manifests, compose-config]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-production
      cancel-in-progress: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Write the new image tags to deploy/production
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin deploy/production >/dev/null; then
            git switch -c deploy/production origin/deploy/production
          else
            git switch --orphan deploy/production
          fi
          # The branch gets main's exact tree, then only the image tags change
          git read-tree -u --reset "$GITHUB_SHA"

          export TAG="sha-${GITHUB_SHA::7}"
          yq -i '(.images[] | select(.name == "ghcr.io/ixi3boda/rentsphere-*")).newTag = strenv(TAG)' \
            k8s/overlays/aws/kustomization.yaml
          git add -A
          git commit -m "Release $TAG" -m "Built from ${GITHUB_SHA}"
          git push origin deploy/production
          echo "Released \`$TAG\` to deploy/production" >> "$GITHUB_STEP_SUMMARY"
