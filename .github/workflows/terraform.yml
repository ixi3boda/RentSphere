name: Terraform

# fmt + validate on every infrastructure change; plan with read-only AWS credentials once the
# account is connected; apply only on demand, from the protected "production" environment.
on:
  push:
    branches: [ main ]
    paths: [ 'infra/terraform/**', '.github/workflows/terraform.yml' ]
  pull_request:
    branches: [ main ]
    paths: [ 'infra/terraform/**', '.github/workflows/terraform.yml' ]
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the production plan
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: terraform-production
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  WORKDIR: infra/terraform/environments/production

jobs:
  validate:
    name: Format and validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6

      - name: Check formatting
        run: terraform fmt -recursive -check -diff infra/terraform

      - name: Validate every root module
        run: |
          for root in infra/terraform/bootstrap infra/terraform/environments/production; do
            echo "== $root"
            terraform -chdir="$root" init -backend=false
            terraform -chdir="$root" validate
          done

  plan:
    name: Plan production
    needs: validate
    # Skipped until the AWS account is bootstrapped and its role ARN stored as a repo variable
    if: vars.AWS_PLAN_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6

      - name: Assume the read-only plan role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: us-east-1

      - name: Init
        run: terraform -chdir="$WORKDIR" init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: Plan
        env:
          TF_VAR_paypal_client_id: ${{ secrets.PAYPAL_CLIENT_ID }}
          TF_VAR_paypal_client_secret: ${{ secrets.PAYPAL_CLIENT_SECRET }}
        run: |
          terraform -chdir="$WORKDIR" plan -lock=false -no-color -out=tfplan | tee plan.txt
          {
            echo '### Terraform plan (production)'
            echo '```'
            grep -E '^(Plan:|No changes)' plan.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: Apply production
    needs: plan
    if: github.event_name == 'workflow_dispatch' && inputs.apply && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6

      - name: Assume the apply role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Init
        run: terraform -chdir="$WORKDIR" init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: Apply
        env:
          TF_VAR_paypal_client_id: ${{ secrets.PAYPAL_CLIENT_ID }}
          TF_VAR_paypal_client_secret: ${{ secrets.PAYPAL_CLIENT_SECRET }}
        run: terraform -chdir="$WORKDIR" apply -auto-approve
