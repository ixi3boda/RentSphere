services:
  mysql:
    image: mysql:8.0
    container_name: rentsphere-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    command:
      - sh
      - -c
      - >
          echo "MySQL is ready at jdbc:mysql://mysql:3306/RentSphereSchema";
          echo "Follow live DB output with: docker compose logs -f mysql";
          exec docker-entrypoint.sh mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./Database/Schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost -u"$$MYSQL_USER" -p"$$MYSQL_PASSWORD" --silent']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    image: rentsphere-backend
    container_name: rentsphere-backend
    expose:
      - "8080"
    # Loopback only: reachable from this machine for development and load tests, while outside
    # traffic has to come through Nginx, which is what makes X-Real-IP below trustworthy.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-RentSphereSchema}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:?Set MYSQL_USER in .env}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:?Set PAYPAL_CLIENT_ID in .env}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:?Set PAYPAL_CLIENT_SECRET in .env}
      PAYPAL_MODE: ${PAYPAL_MODE:-sandbox}
      RENTSPHERE_CORS_ALLOWED_ORIGINS: ${RENTSPHERE_CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:3000}
      # Nginx in front passes the visitor address in X-Real-IP
      RENTSPHERE_RATELIMIT_CLIENT_IP_HEADERS: X-Real-IP
      RENTSPHERE_RATELIMIT_ENABLED: ${RENTSPHERE_RATELIMIT_ENABLED:-true}
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    image: rentsphere-frontend
    container_name: rentsphere-frontend
    expose:
      - "3000"
    ports:
      - "3000:3000"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: rentsphere-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./Nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  mysql_data: